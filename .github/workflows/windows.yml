name: Windows Desktop CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [main, feat/windows-local-ai]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: 'desktop/**/*.csproj'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\desktop\Rota.Windows.Tests\Rota.Windows.Tests.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\desktop\Rota.Windows.Tests\Rota.Windows.Tests.csproj -c Release --no-restore

      - name: Desktop core and WPF window tests
        shell: pwsh
        run: dotnet run --project .\desktop\Rota.Windows.Tests\Rota.Windows.Tests.csproj -c Release --no-build

      - name: Publish self-contained x64
        shell: pwsh
        run: >-
          dotnet publish .\desktop\Rota.Windows\Rota.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:DebugType=None
          /p:DebugSymbols=false
          -o .\artifacts\win-x64

      - name: Validate release PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem '.\desktop\Rota.Windows.Signing\*.ps1', '.\desktop\Rota.Windows.Installer\*.ps1'
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$($script.Name): $($errors[0].Message)" }
          }

      - name: Install pinned installer compiler
        shell: pwsh
        run: >-
          winget install --id JRSoftware.InnoSetup -e --source winget --version 6.7.3
          --silent --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Build and optionally sign Windows release
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($hasCertificate -ne $hasPassword) { throw 'Configure both Windows signing secrets or neither.' }

          if ($hasCertificate) {
            $pfx = Join-Path $env:RUNNER_TEMP 'rota-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
              .\desktop\Rota.Windows.Signing\Build-WindowsRelease.ps1 `
                -PublishDir .\artifacts\win-x64 `
                -OutputDir .\artifacts\installer `
                -Version 0.5.0 `
                -PfxPath $pfx `
                -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD
              New-Item -ItemType File '.\artifacts\signing-enabled.txt' | Out-Null
            }
            finally {
              Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
            }
          }
          else {
            .\desktop\Rota.Windows.Signing\Build-WindowsRelease.ps1 `
              -PublishDir .\artifacts\win-x64 `
              -OutputDir .\artifacts\installer `
              -Version 0.5.0
          }

      - name: Verify Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path '.\artifacts\win-x64\Rota.exe'
          $item = Get-Item $exe
          if ($item.Length -lt 1MB) { throw "Rota.exe is unexpectedly small: $($item.Length) bytes" }

          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductName -ne 'Rota') { throw "Unexpected product name: $($info.ProductName)" }
          if ($info.FileVersion -notlike '0.5.0*') { throw "Unexpected file version: $($info.FileVersion)" }

          $requireTrusted = Test-Path -LiteralPath '.\artifacts\signing-enabled.txt'
          .\desktop\Rota.Windows.Signing\Verify-WindowsSignature.ps1 -Files @(
            $exe.Path,
            (Resolve-Path '.\artifacts\installer\Rota-Windows-v0.5.0-Setup-x64.exe').Path
          ) -RequireTrusted:$requireTrusted
          if (-not $requireTrusted) { Write-Host 'Development artifact: commercial Authenticode certificate is not configured.' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Launch smoke test in dark and light themes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\artifacts\win-x64\Rota.exe').Path
          $themePath = Join-Path $env:RUNNER_TEMP 'theme.txt'
          $utf8 = [Text.UTF8Encoding]::new($false)

          function Invoke-RotaSmoke([string]$theme, [string]$stateName) {
            [IO.File]::WriteAllText($themePath, $theme + [Environment]::NewLine, $utf8)
            $env:ROTA_SMOKE_DATA_PATH = Join-Path $env:RUNNER_TEMP $stateName
            Remove-Item -LiteralPath $env:ROTA_SMOKE_DATA_PATH -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force
              throw "Rota $theme theme startup smoke test timed out."
            }
            if ($process.ExitCode -ne 0) { throw "Rota $theme theme startup smoke test failed with code $($process.ExitCode)" }
            if (-not (Test-Path -LiteralPath $env:ROTA_SMOKE_DATA_PATH)) { throw "Rota $theme theme smoke test did not persist its state." }

            $savedTheme = [IO.File]::ReadAllText($themePath, $utf8).Trim()
            if ($savedTheme -ne $theme) { throw "Theme preference changed unexpectedly: expected $theme, got $savedTheme" }
            Write-Host "Rota loaded the $theme theme and exited cleanly."
          }

          Invoke-RotaSmoke 'dark' 'rota-desktop-smoke-dark.json'
          Invoke-RotaSmoke 'light' 'rota-desktop-smoke-light.json'

      - name: Install update launch and uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path '.\artifacts\installer\Rota-Windows-v0.5.0-Setup-x64.exe').Path
          if ((Get-Item -LiteralPath $installer).Length -lt 10MB) { throw 'The Windows installer is unexpectedly small.' }

          $installRoot = Join-Path $env:RUNNER_TEMP 'Rota-Installer-Smoke'
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installRoot", '/TASKS=') -PassThru -Wait -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer smoke failed with code $($install.ExitCode)." }

          $installedExe = Join-Path $installRoot 'Rota.exe'
          if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) { throw 'Rota.exe was not installed.' }
          $env:ROTA_SMOKE_DATA_PATH = Join-Path $env:RUNNER_TEMP 'rota-installed-smoke.json'
          $launch = Start-Process -FilePath $installedExe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (-not $launch.WaitForExit(15000)) {
            Stop-Process -Id $launch.Id -Force
            throw 'The installed Rota startup smoke test timed out.'
          }
          if ($launch.ExitCode -ne 0) { throw "The installed Rota smoke failed with code $($launch.ExitCode)." }

          $uninstaller = Join-Path $installRoot 'unins000.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'The Windows uninstaller was not registered.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke failed with code $($uninstall.ExitCode)." }
          if (Test-Path -LiteralPath $installedExe) { throw 'Rota.exe remained after uninstall.' }

      - name: Stage artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force '.\artifacts\stage' | Out-Null
          Copy-Item '.\artifacts\win-x64\Rota.exe' '.\artifacts\stage\Rota-Windows-v0.5.0-x64.exe'
          Copy-Item '.\artifacts\installer\Rota-Windows-v0.5.0-Setup-x64.exe' '.\artifacts\stage\Rota-Windows-v0.5.0-Setup-x64.exe'
          Copy-Item '.\desktop\Rota.Windows\README-WINDOWS.md' '.\artifacts\stage\LEIA-ME.txt'
          Copy-Item '.\desktop\Rota.Windows\RELEASE-NOTES-0.5.0-DRAFT.md' '.\artifacts\stage\NOVIDADES-0.5.0.txt'
          Get-ChildItem '.\artifacts\stage\*.exe' | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content -Encoding ascii '.\artifacts\stage\SHA256SUMS.txt'
          $installer = Get-Item '.\artifacts\stage\Rota-Windows-v0.5.0-Setup-x64.exe'
          $manifest = [ordered]@{
            version = '0.5.0'
            installer_url = 'https://github.com/LuviKING/Rota/releases/download/v0.5.0/Rota-Windows-v0.5.0-Setup-x64.exe'
            sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            bytes = $installer.Length
            notes = 'Resumo semanal e mensal, progresso por matéria, calendário com mover/confirmar/desfazer, instalador e atualização segura.'
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM '.\artifacts\stage\windows-update.json'

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Rota-Windows-v0.5.0-x64
          path: artifacts/stage/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

